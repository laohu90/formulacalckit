<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid decoration lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Glowing accent orb in top-right -->
  <circle cx="1020" cy="180" r="240" fill="#3b82f6" opacity="0.15" filter="blur(60px)" />
  <circle cx="200" cy="450" r="180" fill="#10b981" opacity="0.12" filter="blur(60px)" />

  <!-- Left Content Column -->
  <!-- Badge -->
  <rect x="90" y="80" width="220" height="38" rx="19" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" />
  <text x="200" y="104" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#93c5fd" text-anchor="middle" letter-spacing="1.5">PHYSICS CALCULATOR</text>

  <!-- Main Title -->
  <text x="90" y="180" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="60" fill="#ffffff" letter-spacing="-1">
    Density Calculator
  </text>
  <text x="90" y="245" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="48" fill="url(#accent)">
    ρ = m / V (Mass, Volume &amp; Density)
  </text>

  <!-- Subtitle -->
  <text x="90" y="315" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" fill="#94a3b8">
    Instant step-by-step derivations, multi-unit conversions &amp; standard material table.
  </text>
  <text x="90" y="350" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" fill="#94a3b8">
    Includes Archimedes buoyancy simulation, mixture calculator &amp; cosmic spectrum.
  </text>

  <!-- Feature Tags -->
  <g transform="translate(90, 420)">
    <rect x="0" y="0" width="160" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="80" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#38bdf8" text-anchor="middle">⚡ Step-by-Step</text>

    <rect x="180" y="0" width="170" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="265" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#34d399" text-anchor="middle">⚖️ Buoyancy Sim</text>

    <rect x="370" y="0" width="180" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="460" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#fbbf24" text-anchor="middle">🧪 50+ Materials</text>

    <rect x="570" y="0" width="160" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="650" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#a78bfa" text-anchor="middle">🌐 EN / 中文 双语</text>
  </g>

  <!-- Right Visual Card (Scientific Display Box) -->
  <g transform="translate(820, 100)">
    <rect width="300" height="430" rx="24" fill="url(#cardGrad)" stroke="#475569" stroke-width="2" />
    
    <!-- Top Bar -->
    <rect x="25" y="30" width="250" height="60" rx="12" fill="#0f172a" />
    <text x="45" y="66" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#64748b">FORMULA</text>
    <text x="255" y="68" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="24" fill="#38bdf8" text-anchor="end">ρ = m / V</text>

    <!-- Calculation Preview -->
    <text x="25" y="130" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#94a3b8">CALCULATED RESULT</text>
    <rect x="25" y="145" width="250" height="85" rx="16" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5" />
    <text x="45" y="195" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#818cf8">7.874</text>
    <text x="165" y="195" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" fill="#c7d2fe">g/cm³</text>
    <text x="45" y="218" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#34d399">7,874 kg/m³ • Sinks in water</text>

    <!-- Spectrum scale preview mini -->
    <text x="25" y="265" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94a3b8">COSMIC SPECTRUM</text>
    <rect x="25" y="280" width="250" height="12" rx="6" fill="#0f172a" />
    <rect x="25" y="280" width="130" height="12" rx="6" fill="url(#accent)" />
    <circle cx="155" cy="286" r="8" fill="#ffffff" stroke="#2563eb" stroke-width="3" />
    
    <text x="25" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">Water (4°C): 1.000 g/cm³</text>
    <text x="25" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">Iron / Steel: 7.874 g/cm³</text>
    <text x="25" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">Gold (24K): 19.32 g/cm³</text>
  </g>

  <!-- Bottom Brand -->
  <text x="90" y="555" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" fill="#64748b">
    densitycalculator.org • 100% Free &amp; Instant Online Science Calculator
  </text>
</svg>
